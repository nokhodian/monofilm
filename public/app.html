<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monofilm</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wizard.css">
<link rel="stylesheet" href="wizard-stage.css">
<link rel="stylesheet" href="wizard-pack.css">
<link rel="stylesheet" href="wizard-scenes.css">
<link rel="stylesheet" href="wizard-steps35.css">
<link rel="stylesheet" href="wizard-auto.css">
<link rel="stylesheet" href="zoom.css">
</head>
<body>
<header class="bar">
  <b class="brand">Monofilm</b>
  <div id="apwrap" class="apwrap" hidden><button id="apchip" class="apchip" type="button"></button><button id="apmore" class="apmore" type="button" aria-label="Details about what the AI is doing" aria-expanded="false" aria-controls="appanel">▾</button><div id="appanel" class="appanel" hidden role="region" aria-label="Roll camera"></div></div>
  <select id="prod" aria-label="Production" hidden></select>
  <button class="btn sm" data-act="newprod" id="newprod" hidden>New production</button>
  <span class="sp"></span>
  <span id="live" class="mute small" hidden></span><a id="pendchip" class="tag" href="#/w/accounts" hidden></a><a id="credchip" class="tag" href="#/w/credits" hidden></a><button class="btn sm" data-act="addcred" id="addcred" hidden title="Raise this production's credit budget">+ Credits</button>
  <span id="who" class="mute"></span>
  <button class="btn sm" data-act="logout" id="logout" hidden>Sign out</button>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
